[project]
name = "oddments"
version = "0.10.1"
description = "Collection of general-purpose utilities."
authors = [
    { name = "Zachary Einck", email = "zacharyeinck@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
]

[project.urls]
repository = "https://github.com/zteinck/oddments"
homepage = "https://github.com/zteinck/oddments"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
